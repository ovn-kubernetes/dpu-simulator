name: Kind TFT

on:
  workflow_call:
    inputs:
      config:
        description: dpu-sim config path in the dpu-simulator repository.
        required: false
        type: string
        default: ci/config-kind-ovnk-offload.yaml
      tft-config:
        description: TFT config path in the caller repository; empty uses the dpu-sim suite for the deploy mode.
        required: false
        type: string
        default: ""
      tft-repo-url:
        description: TFT repository URL.
        required: false
        type: string
        default: https://github.com/ovn-kubernetes/kubernetes-traffic-flow-tests
      tft-ref:
        description: TFT git ref.
        required: false
        type: string
        default: main
      ovn-kubernetes-repo-url:
        description: OVN-Kubernetes repository URL.
        required: false
        type: string
        default: https://github.com/ovn-kubernetes/ovn-kubernetes
      ovn-kubernetes-ref:
        description: OVN-Kubernetes git ref.
        required: false
        type: string
        default: master
      deploy-mode:
        description: DPU-Sim deploy mode.
        required: false
        type: string
        default: overlay
      run-kube-burner:
        description: Run kube-burner node-density-cni before traffic flow tests.
        required: false
        type: boolean
        default: false
      run-tft:
        description: Run kubernetes-traffic-flow-tests after deploy (default true for callers that omit this input).
        required: false
        type: boolean
        default: true
      kube-burner-pods-per-node:
        description: --pods-per-node for kube-burner.
        required: false
        type: number
        default: 64
      tft-env:
        description: Newline-separated TFT environment overrides.
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: Prefix for uploaded artifacts.
        required: false
        type: string
        default: kind-dpu-offload

jobs:
  kind-tft:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DPU_SIM_ROOT: ${{ github.workspace }}/dpu-simulator
      OVN_KUBERNETES_ROOT: ${{ github.workspace }}/ovn-kubernetes
      TFT_ROOT: ${{ github.workspace }}/kubernetes-traffic-flow-tests
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout dpu-simulator
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dpu-simulator

      - name: Free disk space
        uses: ./dpu-simulator/.github/actions/free-disk-space

      - name: Resolve config paths
        id: paths
        env:
          CONFIG: ${{ inputs.config }}
          TFT_CONFIG: ${{ inputs.tft-config }}
          DEPLOY_MODE: ${{ inputs.deploy-mode }}
          RUN_TFT: ${{ inputs.run-tft }}
        run: |
          config_path="${DPU_SIM_ROOT}/${CONFIG}"
          case "${DEPLOY_MODE}" in
            overlay|no-overlay) ;;
            *)
              echo "::error::invalid deploy-mode: ${DEPLOY_MODE}"
              exit 1
              ;;
          esac
          if [ ! -f "${config_path}" ]; then
            echo "::error::dpu-sim config not found: ${config_path}"
            exit 1
          fi
          # workflow_call boolean defaults to true; treat empty as true for older callers.
          case "${RUN_TFT}" in
            false|False|FALSE|0) RUN_TFT=false ;;
            *) RUN_TFT=true ;;
          esac
          tft_config_path=""
          if [ "${RUN_TFT}" = "true" ]; then
            if [ -n "${TFT_CONFIG}" ]; then
              tft_config_path="${GITHUB_WORKSPACE}/${TFT_CONFIG}"
            elif [ "${DEPLOY_MODE}" = "no-overlay" ]; then
              tft_config_path="${DPU_SIM_ROOT}/ci/tft-config/tft-no-overlay.yaml"
            else
              tft_config_path="${DPU_SIM_ROOT}/ci/tft-config/tft-overlay.yaml"
            fi
            if [ ! -f "${tft_config_path}" ]; then
              echo "::error::TFT config not found: ${tft_config_path}"
              exit 1
            fi
          fi
          {
            echo "config_path=${config_path}"
            echo "config_workdir=${DPU_SIM_ROOT}"
            echo "tft_config_path=${tft_config_path}"
            echo "deploy_mode=${DEPLOY_MODE}"
            echo "run_tft=${RUN_TFT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout OVN-Kubernetes
        env:
          OVN_KUBERNETES_REPO_URL: ${{ inputs.ovn-kubernetes-repo-url }}
          OVN_KUBERNETES_REF: ${{ inputs.ovn-kubernetes-ref }}
        run: |
          if [ -d "${OVN_KUBERNETES_ROOT}/.git" ]; then
            git -C "${OVN_KUBERNETES_ROOT}" remote set-url origin "${OVN_KUBERNETES_REPO_URL}"
            git -C "${OVN_KUBERNETES_ROOT}" fetch --depth=1 origin "${OVN_KUBERNETES_REF}"
            git -C "${OVN_KUBERNETES_ROOT}" checkout --detach FETCH_HEAD
          else
            rm -rf "${OVN_KUBERNETES_ROOT}"
            git clone --depth=1 "${OVN_KUBERNETES_REPO_URL}" "${OVN_KUBERNETES_ROOT}"
            git -C "${OVN_KUBERNETES_ROOT}" fetch --depth=1 origin "${OVN_KUBERNETES_REF}"
            git -C "${OVN_KUBERNETES_ROOT}" checkout --detach FETCH_HEAD
          fi

      - name: Checkout kubernetes-traffic-flow-tests
        if: ${{ steps.paths.outputs.run_tft == 'true' }}
        env:
          TFT_REPO_URL: ${{ inputs.tft-repo-url }}
          TFT_REF: ${{ inputs.tft-ref }}
        run: |
          tft_repo="${TFT_ROOT}"
          if [ -d "${tft_repo}/.git" ]; then
            git -C "${tft_repo}" remote set-url origin "${TFT_REPO_URL}"
          else
            rm -rf "${tft_repo}"
            git clone --no-checkout --depth=1 "${TFT_REPO_URL}" "${tft_repo}"
          fi
          git -C "${tft_repo}" fetch --depth=1 origin "${TFT_REF}"
          git -C "${tft_repo}" checkout --detach FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dpu-simulator/go.mod
          cache: true
          cache-dependency-path: dpu-simulator/go.sum

      - name: Install libvirt development headers
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev

      - name: Install VRF kernel module
        if: ${{ steps.paths.outputs.deploy_mode == 'no-overlay' || steps.paths.outputs.run_tft == 'true' }}
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vrf

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up Python for traffic flow tests
        if: ${{ steps.paths.outputs.run_tft == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kind
        run: |
          KIND_VERSION=v0.31.0
          curl -fsSLo /tmp/kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo /tmp/kind-linux-amd64.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          (cd /tmp && sha256sum -c kind-linux-amd64.sha256sum)
          chmod +x /tmp/kind-linux-amd64
          sudo mv /tmp/kind-linux-amd64 /usr/local/bin/kind

      - name: Build dpu-sim
        working-directory: ${{ env.DPU_SIM_ROOT }}
        run: make build

      - name: Disable containerd image store
        # Workaround for https://github.com/kubernetes-sigs/kind/issues/3795
        # Docker 27+ on ubuntu-24.04 enables the containerd snapshotter by default,
        # which prevents kind from loading images into the cluster.
        run: |
          sudo mkdir -p /etc/docker
          [ -s "/etc/docker/daemon.json" ] && {
            cat "/etc/docker/daemon.json" | jq '. + {"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
          } || {
            echo '{"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
          }
          sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Deploy Kind clusters (OVN-Kubernetes overlay)
        if: ${{ steps.paths.outputs.deploy_mode == 'overlay' }}
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        env:
          KIND_EXPERIMENTAL_PROVIDER: docker
          CONFIG_PATH: ${{ steps.paths.outputs.config_path }}
          # Keep docker save temp files off of /tmp to runner.temp
          TMPDIR: ${{ runner.temp }}
          DPU_SIM_KIND_IMAGE_TMPDIR: ${{ runner.temp }}
        run: |
          "${DPU_SIM_ROOT}/bin/dpu-sim" --config "${CONFIG_PATH}" --ovn-kubernetes-path "${OVN_KUBERNETES_ROOT}"

      - name: Deploy no-overlay DPU simulator with Helm
        if: ${{ steps.paths.outputs.deploy_mode == 'no-overlay' }}
        working-directory: ${{ env.OVN_KUBERNETES_ROOT }}
        env:
          DPU_SIM_CONFIG: ${{ steps.paths.outputs.config_path }}
          KIND_EXPERIMENTAL_PROVIDER: docker
          # Keep docker save temp files off of /tmp to runner.temp
          TMPDIR: ${{ runner.temp }}
          DPU_SIM_KIND_IMAGE_TMPDIR: ${{ runner.temp }}
        run: ./contrib/kind-dpu-sim-no-overlay.sh

      - name: Verify clusters are ready
        if: ${{ steps.paths.outputs.deploy_mode == 'overlay' }}
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        run: |
          kubectl wait --for=condition=Ready nodes --all \
            --kubeconfig kubeconfig/dpu-sim-host.kubeconfig --timeout=25m
          kubectl wait --for=condition=Ready nodes --all \
            --kubeconfig kubeconfig/dpu-sim-dpu.kubeconfig --timeout=25m

      - name: Install kube-burner
        if: ${{ inputs.run-kube-burner }}
        run: |
          # Pinned to current latest stable (assets use capital V, e.g. V2.7.3).
          KUBE_BURNER_VERSION=v2.7.3
          ARCHIVE_VERSION="V${KUBE_BURNER_VERSION#v}"
          curl -fsSL "https://github.com/kube-burner/kube-burner/releases/download/${KUBE_BURNER_VERSION}/kube-burner-${ARCHIVE_VERSION}-linux-x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kube-burner
          kube-burner version

      - name: Run kube-burner node-density-cni
        if: ${{ inputs.run-kube-burner }}
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        env:
          KIND_EXPERIMENTAL_PROVIDER: docker
          CONFIG_PATH: ${{ steps.paths.outputs.config_path }}
          PODS_PER_NODE: ${{ inputs.kube-burner-pods-per-node }}
        run: |
          "${DPU_SIM_ROOT}/bin/dpu-sim" kube-burner run \
            --config "${CONFIG_PATH}" \
            --pods-per-node "${PODS_PER_NODE}" \
            --timeout 5m \
            --skip-install

      - name: TFT Python venv
        if: ${{ steps.paths.outputs.run_tft == 'true' }}
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        env:
          CONFIG_PATH: ${{ steps.paths.outputs.config_path }}
        run: |
          "${DPU_SIM_ROOT}/bin/dpu-sim" tft venv --config "${CONFIG_PATH}" --tft-repo-path "${TFT_ROOT}"

      - name: Run traffic flow tests
        if: ${{ steps.paths.outputs.run_tft == 'true' }}
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        env:
          CONFIG_PATH: ${{ steps.paths.outputs.config_path }}
          CONFIG_WORKDIR: ${{ steps.paths.outputs.config_workdir }}
          TFT_CONFIG_PATH: ${{ steps.paths.outputs.tft_config_path }}
          TFT_ENABLE_TARGET_ACCESS_SUBTESTS: "true"
          TFT_ENV: ${{ inputs.tft-env }}
        run: |
          tft_env_args=()
          while IFS= read -r entry || [ -n "${entry}" ]; do
            [ -z "${entry}" ] && continue
            key="${entry%%=*}"
            if [ "${entry}" = "${key}" ]; then
              echo "::error::tft-env entries must be KEY=VALUE: ${entry}"
              exit 1
            fi
            if [[ ! "${key}" =~ ^TFT_[A-Z0-9_]+$ ]]; then
              echo "::error::invalid tft-env key: ${key}"
              exit 1
            fi
            tft_env_args+=("${entry}")
          done <<< "${TFT_ENV}"

          env "${tft_env_args[@]}" \
            TFT_KUBECONFIG="${CONFIG_WORKDIR}/kubeconfig/dpu-sim-host.kubeconfig" \
            "${DPU_SIM_ROOT}/bin/dpu-sim" tft run --config "${CONFIG_PATH}" --tft-config "${TFT_CONFIG_PATH}" --tft-repo-path "${TFT_ROOT}" --check

      - name: Run Uplink DPU e2e tests
        if: ${{ steps.paths.outputs.deploy_mode == 'no-overlay' }}
        working-directory: ${{ env.OVN_KUBERNETES_ROOT }}
        run: |
          set -euo pipefail
          source "${DPU_SIM_ROOT}/kubeconfig/helm-values/dpu-sim-dpu-frr-k8s.env"
          export KUBECONFIG="${DPU_SIM_ROOT}/kubeconfig/dpu-sim-host.kubeconfig"
          export OVN_TEST_DPU_UPLINK_NETWORK="dpu-sim-uplink"
          # The interface reserved for the uplink, published by dpu-sim in the
          # sourced env file (uplink_vfs_count in the dpu-sim config).
          if [ -z "${DPU_SIM_UPLINK_HOST_INTERFACES:-}" ]; then
            echo "::error::dpu-sim did not publish DPU_SIM_UPLINK_HOST_INTERFACES; check uplink_vfs_count in the dpu-sim config"
            exit 1
          fi
          export OVN_TEST_DPU_UPLINK_HOST_INTERFACE="${DPU_SIM_UPLINK_HOST_INTERFACES%%,*}"
          export OVN_TEST_DPU_UPLINK_EXPECTED_BRIDGE="breth-uplink"
          export OVN_TEST_BGP_SERVER_NET_SUBNET_IPV4="172.29.0.0/16"
          export OVN_TEST_BGP_SERVER_NET_SUBNET_IPV6="fc00:f853:ccd:e797::/64"
          export OVN_TEST_BGP_ROUTER_CONTAINER="dpu-sim-frr"
          export OVN_TEST_BGP_SERVER_CONTAINER="dpu-sim-bgpserver"
          export OVN_TEST_BGP_SERVER_NETWORK="dpu-sim-bgpnet"
          export ENABLE_MULTI_NET=true
          export ENABLE_NETWORK_SEGMENTATION=true
          export ENABLE_ROUTE_ADVERTISEMENTS=true
          export ENABLE_NO_OVERLAY=true
          export ENABLE_UPLINK=true
          export DYNAMIC_UDN_ALLOCATION=true
          make -C test control-plane WHAT="Uplink"

      # Collect before Cleanup so cancelled/failed runs still leave artifacts.
      # always() covers failure and cancelled; continue-on-error keeps Cleanup reachable.
      - name: Export kind logs
        if: always()
        continue-on-error: true
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          KIND_EXPERIMENTAL_PROVIDER: docker
        run: |
          set +e
          logs_dir="/tmp/${ARTIFACT_PREFIX}-logs"
          mkdir -p "${logs_dir}"
          for cluster in dpu-sim-host dpu-sim-host-kind dpu-sim-dpu dpu-sim-dpu-kind; do
            kind export logs "${logs_dir}" --name "${cluster}" 2>/dev/null || true
          done
          host_kc="${DPU_SIM_ROOT}/kubeconfig/dpu-sim-host.kubeconfig"
          dpu_kc="${DPU_SIM_ROOT}/kubeconfig/dpu-sim-dpu.kubeconfig"
          if [ -f "${host_kc}" ]; then
            kubectl --kubeconfig "${host_kc}" get pods -A -o wide \
              > "${logs_dir}/dpu-sim-host-pods.txt" 2>&1 || true
            kubectl --kubeconfig "${host_kc}" get nodes -o wide \
              > "${logs_dir}/dpu-sim-host-nodes.txt" 2>&1 || true
            kubectl --kubeconfig "${host_kc}" get events -A --sort-by='.lastTimestamp' \
              > "${logs_dir}/dpu-sim-host-events.txt" 2>&1 || true
          else
            echo "host kubeconfig missing: ${host_kc}" > "${logs_dir}/dpu-sim-host-pods.txt"
          fi
          if [ -f "${dpu_kc}" ]; then
            kubectl --kubeconfig "${dpu_kc}" get pods -A -o wide \
              > "${logs_dir}/dpu-sim-dpu-pods.txt" 2>&1 || true
            kubectl --kubeconfig "${dpu_kc}" get nodes -o wide \
              > "${logs_dir}/dpu-sim-dpu-nodes.txt" 2>&1 || true
            kubectl --kubeconfig "${dpu_kc}" get events -A --sort-by='.lastTimestamp' \
              > "${logs_dir}/dpu-sim-dpu-events.txt" 2>&1 || true
          else
            echo "dpu kubeconfig missing: ${dpu_kc}" > "${logs_dir}/dpu-sim-dpu-pods.txt"
          fi
          exit 0

      - name: Upload kind logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-logs
          path: /tmp/${{ inputs.artifact-prefix }}-logs
          if-no-files-found: ignore

      - name: Collect kube-burner diagnostics
        if: ${{ always() && inputs.run-kube-burner }}
        continue-on-error: true
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          set +e
          out_dir="/tmp/${ARTIFACT_PREFIX}-kube-burner"
          mkdir -p "${out_dir}"
          host_kc="${DPU_SIM_ROOT}/kubeconfig/dpu-sim-host.kubeconfig"
          work_dir="${DPU_SIM_ROOT}/workloads/kube-burner-node-density-cni-dpusim"

          if [ -d "${work_dir}" ]; then
            cp -a "${work_dir}" "${out_dir}/workdir" 2>/dev/null || true
          else
            echo "kube-burner workdir missing: ${work_dir}" > "${out_dir}/workdir-missing.txt"
          fi

          if [ ! -f "${host_kc}" ]; then
            echo "host kubeconfig missing: ${host_kc}" > "${out_dir}/kubeconfig-missing.txt"
            exit 0
          fi

          kubectl --kubeconfig "${host_kc}" get ns -o name 2>/dev/null \
            | grep 'namespace/node-density-cni' \
            > "${out_dir}/namespaces.txt" || true
          kubectl --kubeconfig "${host_kc}" get pods -A -o wide 2>/dev/null \
            | grep -E 'NAMESPACE|node-density-cni' \
            > "${out_dir}/pods.txt" || true
          kubectl --kubeconfig "${host_kc}" get deploy,svc,ep -A 2>/dev/null \
            | grep -E 'NAMESPACE|node-density-cni' \
            > "${out_dir}/workloads.txt" || true
          kubectl --kubeconfig "${host_kc}" get events -A --sort-by='.lastTimestamp' 2>/dev/null \
            | grep -E 'LAST SEEN|node-density-cni' \
            > "${out_dir}/events.txt" || true
          kubectl --kubeconfig "${host_kc}" get nodes -l 'k8s.ovn.org/dpu-host=' -o wide \
            > "${out_dir}/dpu-host-nodes.txt" 2>&1 || true
          kubectl --kubeconfig "${host_kc}" get nodes -l 'k8s.ovn.org/dpu-host=' \
            -o custom-columns=NAME:.metadata.name,ALLOC_VF:.status.allocatable.dpusim\\.io/vf,CAP_VF:.status.capacity.dpusim\\.io/vf \
            > "${out_dir}/dpu-host-vf.txt" 2>&1 || true

          # Describe not-Ready density pods (Pending/ContainerCreating or
          # Running with failing probes). Cap to keep artifacts small.
          mkdir -p "${out_dir}/pod-describe"
          count=0
          while IFS= read -r line; do
            ns="${line%% *}"
            name="${line#* }"
            [ -z "${ns}" ] || [ -z "${name}" ] && continue
            kubectl --kubeconfig "${host_kc}" describe pod -n "${ns}" "${name}" \
              > "${out_dir}/pod-describe/${ns}_${name}.txt" 2>&1 || true
            count=$((count + 1))
            [ "${count}" -ge 40 ] && break
          done < <(
            kubectl --kubeconfig "${host_kc}" get pods -A --no-headers 2>/dev/null \
              | awk '/node-density-cni/ {
                  split($3, r, "/");
                  if ($4 != "Running" || r[1] != r[2] || r[2] == 0) print $1, $2
                }'
          )
          exit 0

      - name: Upload kube-burner diagnostics
        if: ${{ always() && inputs.run-kube-burner }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-kube-burner
          path: /tmp/${{ inputs.artifact-prefix }}-kube-burner
          if-no-files-found: ignore

      - name: Collect TFT results
        if: ${{ always() && steps.paths.outputs.run_tft == 'true' }}
        continue-on-error: true
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          set +e
          results_dir="${TFT_ROOT}/ft-logs"
          artifact_dir="/tmp/${ARTIFACT_PREFIX}-tft-results"
          if [ -d "${results_dir}" ]; then
            mkdir -p "${artifact_dir}"
            cp -a "${results_dir}/." "${artifact_dir}/" || true
          fi
          exit 0

      - name: Upload TFT results
        if: ${{ always() && steps.paths.outputs.run_tft == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-tft-results
          path: /tmp/${{ inputs.artifact-prefix }}-tft-results
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        continue-on-error: true
        working-directory: ${{ steps.paths.outputs.config_workdir }}
        env:
          KIND_EXPERIMENTAL_PROVIDER: docker
          CONFIG_PATH: ${{ steps.paths.outputs.config_path }}
        run: |
          "${DPU_SIM_ROOT}/bin/dpu-sim" --config "${CONFIG_PATH}" --ovn-kubernetes-path "${OVN_KUBERNETES_ROOT}" --cleanup || true
