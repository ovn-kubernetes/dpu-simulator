tft:
  - name: "tft-no-overlay"
    namespace: "default"
    test_cases: "1-24,26-28,35-40,42-45,70-81"
    duration: 5
    pre_provision: true
    udn_primary_network:
      mode: cudn
      topology: layer3
      transport: no-overlay
      route_advertisement:
        frr_configuration_selector:
          name: receive-all
    connections:
      - name: "iperf-tcp"
        type: "iperf-tcp"
        instances: 1
        reverse: false
        server:
          - name: "@host-1"
            persistent: false
            sriov: true
            default_network: "default/ovn-primary"
        client:
          - name: "@host-2"
            sriov: true
            default_network: "default/ovn-primary"
        resource_name: "dpusim.io/vf"
      - name: "http-curl"
        type: "http"
        instances: 1
        reverse: false
        server:
          - name: "@host-1"
            persistent: false
            sriov: true
            default_network: "default/ovn-primary"
        client:
          - name: "@host-2"
            sriov: true
            default_network: "default/ovn-primary"
        resource_name: "dpusim.io/vf"
